name: CI

# Runs the full nine-row mechanical gate (FULL=1 scripts/ci.sh, SPEC §7.6)
# once per pull request into main or a feat/** integration branch. Local runs
# of scripts/ci.sh are the quick check; there is no push trigger.
on:
  pull_request:
    branches: [main, 'feat/**']

permissions:
  contents: read

# One run per ref. A new push to a PR cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Same Node line as pages.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      # playwright.config.ts has a single chromium project. The browser
      # download is cached per Playwright version; system deps are not
      # cached, so a hit still installs them.
      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: web

      - name: Run the gate
        run: FULL=1 ./scripts/ci.sh

      # The config uses the list reporter; traces and screenshots from
      # failed tests land in web/test-results.
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
