    verify: [bridge-smoke, unit-test]
    status: verified
    evidence: "go: TestR1_1a_GoldenSeedDeal, TestR1_1b_CanonicalDeckOrder, TestR1_1c_GoldenDealThroughBridge; bridge-smoke: 'reproduces the seed-42 golden deal byte-for-byte'. gate 2026-09-26 (re-run after Batch 1 follow-ups: mover-view apply, index redaction, subKind, restore(snapshot, viewerId)): go build/wasm build/go vet/go test ./... green; test:smoke 4/4 green. Deck-order criterion is covered by a Go unit test (dealing is Go-only; no TS surface to vitest). | VERIFIED round-01 post-integration gate on loop/integration @ 08bc32f: 9/9 green (go build, wasm build, go vet, go test, svelte-check, lint, vitest 11 files/217 tests, test:smoke 6/6, test:e2e 1/1); the listed tests ran inside it."
    fails: 0

