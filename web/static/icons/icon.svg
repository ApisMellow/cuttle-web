<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Cuttle app icon, hand-authored (W23, PRD §10 A-4 follow-up: home-screen
    launch icon). Ink table background behind a pair of fanned cards, a
    patterned back and a paper face bearing a single spade pip, built from
    the app's own design tokens (lib/styles/tokens.css): cu-ink,
    cu-back-a / cu-back-b, cu-paper, cu-ink-line, cu-suit-black.
    Rendered to PNG at 180/192/512 via rsvg-convert for the manifest and
    apple-touch-icon (no build-time SVG rasterization in this repo).
  -->
  <rect width="512" height="512" fill="#241c2b"/>

  <!-- Card back, fanned back-left -->
  <g transform="rotate(-13 196 278)">
    <rect x="86" y="124" width="220" height="308" rx="22" fill="#3b2f4a" stroke="#4a3d57" stroke-width="3"/>
    <rect x="106" y="144" width="180" height="268" rx="14" fill="none" stroke="#5ccfc4" stroke-width="3"/>
  </g>

  <!-- Card face, fanned front-right, on top -->
  <g transform="rotate(11 306 250)">
    <rect x="196" y="96" width="220" height="308" rx="22" fill="#faf8f4" stroke="#4a3d57" stroke-width="3"/>
    <g transform="translate(306 250) scale(7.4) translate(-12 -12)">
      <path
        d="M12 2C12 2 4 10 4 15C4 17.7614 6.23858 20 9 20C10.0505 20 11.0139 19.6743 11.8 19.126C11.6892 19.7047 11.5 20.5 11 21C10.5 21.5 9.5 22 9.5 22H14.5C14.5 22 13.5 21.5 13 21C12.5 20.5 12.3108 19.7047 12.2 19.126C12.9861 19.6743 13.9495 20 15 20C17.7614 20 20 17.7614 20 15C20 10 12 2 12 2Z"
        fill="#1f1824"
      />
    </g>
  </g>
</svg>
